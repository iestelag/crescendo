services:
  web:
    build: .
    container_name: crescendo_copia_web
    ports:
      - "8090:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: crescendo_copia_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: crescendo
      MYSQL_USER: crescendo_user
      MYSQL_PASSWORD: crescendo_pass
    ports:
      - "3308:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/crescendo.sql:/docker-entrypoint-initdb.d/crescendo.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: crescendo_copia_phpmyadmin
    restart: always
    ports:
      - "8091:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  db_data: